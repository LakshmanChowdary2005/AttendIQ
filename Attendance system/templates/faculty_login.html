<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Portal Login | AttendIQ AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #070a11;
      --accent-gold: #f59e0b;
      --accent-amber: #fbbf24;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --border-subtle: rgba(245, 158, 11, 0.2);
      --border-glow: rgba(245, 158, 11, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-base);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(245, 158, 11, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }

    /* Ambient Glow */
    .glow-sphere {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    /* Glassmorphic Login Container */
    .login-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 42px 36px;
      width: 410px;
      max-width: 92vw;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
      text-align: center;
      z-index: 10;
      position: relative;
      transition: border-color 0.3s ease;
    }

    .login-card:hover {
      border-color: var(--border-glow);
    }

    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent-amber);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .sub-text {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    /* Role Switcher */
    .role-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }

    .role-tab {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .role-tab.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.4);
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.25);
    }

    .input-field::placeholder {
      color: #6b7280;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 0;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(6, 182, 212, 0.55);
    }

    .error-alert {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #fb7185;
      font-weight: 600;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent-cyan);
    }
  </style>
</head>

<body>

  <div class="glow-sphere"></div>

  <!-- Faculty Login Card -->
  <div class="login-card">
    <div class="portal-badge">Faculty Portal</div>
    <div class="brand-icon" style="font-size:18px; font-weight:800; color:var(--accent-gold);">[FAC]</div>
    <h2>Faculty Login</h2>
    <p class="sub-text">Access attendance control, AI risk predictions & homework dispatches</p>

    <!-- Role Switcher -->
    <div class="role-switcher">
      <a href="/student_login" class="role-tab">Student</a>
      <a href="/faculty_login" class="role-tab active">Faculty</a>
      <a href="/admin_login" class="role-tab">Admin</a>
    </div>

    {% if error %}
      <div class="error-alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/faculty_login">
      <div class="form-group">
        <label>Faculty Code / Username</label>
        <input
          type="text"
          name="faculty_code"
          class="input-field"
          placeholder="e.g. FAC01"
          required
          autocomplete="off"
          autofocus
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          class="input-field"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="submit-btn">
        <span>Enter Faculty Portal</span>
      </button>
    </form>

    <a href="/" class="back-link">← Return to Platform Homepage</a>
  </div>

</body>
</html>
