<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Mark Attendance</title>

 <style>
    .student-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 15px;
        margin-top: 20px;
    }

    .student-item {
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        background: linear-gradient(145deg, #f0f0f0, #ffffff);
        box-shadow: 4px 4px 10px rgba(0,0,0,0.1),
                    -4px -4px 10px rgba(255,255,255,0.7);
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .student-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .student-item input {
        transform: scale(1.2);
        margin-bottom: 8px;
    }

    .roll-no {
        font-size: 13px;
        font-weight: bold;
        color: #555;
        letter-spacing: 1px;
    }

    .student-name {
        font-size: 15px;
        font-weight: 600;
        color: #000;
        margin-top: 4px;
    }
</style>

</head>

<body>

<h2>Mark Attendance</h2>

<a href="/logout">
    <button>Logout</button>
</a>

<form method="POST" action="/mark">

    <br><br>

    <label><b>Subject:</b></label><br>
    <select name="subject" required>
        <option value="">-- Select Subject --</option>
        {% for sub in [
            "DevOps",
            "Software Project Management",
            "Soft Skills",
            "Machine Learning",
            "Machine Learning Lab",
            "Cloud Computing",
            "Cloud Computing Lab",
            "Cryptography and Network Security",
            "IPR",
            "CRT",
            "E-Waste Management"
        ] %}
            <option value="{{ sub }}">{{ sub }}</option>
        {% endfor %}
    </select>

    <br><br>

    <!-- <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" style="vertical-align:middle; display:inline-block;"><polyline points="20 6 9 17 4 12"/></svg> STUDENTS GRID (THIS WAS MISSING / BROKEN) -->
    <div class="student-grid">
    {% for s in students %}
        <label class="student-item">
            <input type="checkbox" name="present_students" value="{{ s[0] }}">
            <br>
            <b>{{ s[1] }}</b><br>
            <span style="font-size: 13px; color: gray;">
                {{ s[2] }}
            </span>
        </label>
    {% endfor %}
</div>


    <br>

    <button type="submit">Submit Attendance</button>

</form>

</body>
</html>
